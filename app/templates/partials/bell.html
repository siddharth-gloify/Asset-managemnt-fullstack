<span id="bell-badge" class="ms-auto" hx-get="/notifications/badge" hx-trigger="every 60s" hx-swap="outerHTML">{% if unread %}<span class="py-0.5 px-1.5 inline-flex items-center text-xs font-medium bg-red-600 text-white rounded-full" aria-label="{{ unread }} unread">{{ unread if unread < 100 else '99+' }}</span>{% endif %}</span>
