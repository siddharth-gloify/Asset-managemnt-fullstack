{# Masked "last password"; Reveal decrypts server-side and writes an audit entry. #}
{% set aid = asset.id if asset is defined else asset_id %}
<span id="pw-{{ aid }}" class="inline-flex items-center gap-2">
  {% if value is defined %}
    {% if value %}<code class="font-mono text-sm bg-gray-100 px-1.5 py-0.5 rounded select-all">{{ value }}</code>{% else %}<span class="text-gray-500">—</span>{% endif %}
  {% elif has_password %}
    <span class="tracking-widest text-gray-500">••••••••</span>
    <button type="button" hx-post="/assets/{{ aid }}/reveal-password" hx-target="#pw-{{ aid }}" hx-swap="outerHTML"
            class="text-brand-600 hover:underline text-xs font-medium">Reveal</button>
  {% else %}
    <span class="text-gray-500">—</span>
  {% endif %}
</span>
