# Local development database only. Production uses Neon via the Vercel Marketplace.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: assetify
      POSTGRES_PASSWORD: assetify
      POSTGRES_DB: assetify
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro

volumes:
  pgdata:

